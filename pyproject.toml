[project]
name = "labrats"
version = "0.1.0"
description = "Personalized biorxiv preprint triage and ideation engine"
requires-python = ">=3.11"
dependencies = [
	"requests",
	"litellm",
	"pyyaml",
	"typer",
	"rich",
	"loguru",
]

[project.optional-dependencies]
dev = ["pytest"]

[project.scripts]
labrats = "labrats.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]
