<!DOCTYPE html>
<!-- labrats UI shell. CSS/JS live in labrats/static/. -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>labrats</title>
<link rel="stylesheet" href="/static/app.css">
</head>
<body>
<header style="position:relative">
  <div class="progress-bar" id="progress-bar" style="width:0"></div>
  <span class="header-title">labrats</span>
  <div class="header-right">
    <span class="run-status" id="run-status"></span>
    <button class="run-btn" id="run-btn" data-action="startRun">
      Run
    </button>
  </div>
</header>
<div class="layout">

  <nav class="sidebar">
    <div class="sidebar-main" id="digest-tabs"></div>
    <div class="sidebar-bottom">
      <button class="tab-btn" id="tab-config" data-action="showConfig">
        <span>Settings</span>
      </button>
    </div>
  </nav>

  <main class="content">

    <!-- ── Digest view ── -->
    <div class="view active" id="digest-view">
      <div id="digest-content"></div>
    </div>

    <!-- ── Config view ── -->
    <div class="view" id="config-view">
      <div class="config-tabs">
        <button class="config-tab-btn active"
                data-action="showConfigTab" data-tab="personas">
          Personas</button>
        <button class="config-tab-btn"
                data-action="showConfigTab" data-tab="profiles">
          Profiles</button>
        <button class="config-tab-btn"
                data-action="showConfigTab" data-tab="settings">
          Settings</button>
      </div>

      <!-- personas -->
      <div class="config-panel active" id="cpanel-personas">
        <button class="btn btn-primary add-btn"
                data-action="showNewPersona">+ Add persona</button>
        <div id="new-persona-form" class="card" hidden>
          <div class="card-title" style="margin-bottom:0.5rem">
            New persona</div>
          <div id="new-persona-fields"></div>
        </div>
        <div id="persona-list"></div>
      </div>

      <!-- profiles -->
      <div class="config-panel" id="cpanel-profiles">
        <button class="btn btn-primary add-btn"
                data-action="showNewProfile">+ Add profile</button>
        <div id="new-profile-form" class="card" hidden>
          <div class="card-title" style="margin-bottom:0.5rem">
            New profile</div>
          <div id="new-profile-fields"></div>
        </div>
        <div id="profile-list"></div>
      </div>

      <!-- settings -->
      <div class="config-panel" id="cpanel-settings">
        <div class="card" style="margin-bottom:1rem">
          <div class="card-title"
               style="margin-bottom:0.75rem">
            Default Model</div>
          <p class="card-meta" style="margin-bottom:0.75rem">
            Used when no profile-level or persona-level
            override is set.</p>
          <div id="default-model-field"></div>
          <div class="btn-row">
            <button class="btn btn-primary"
                    data-action="saveDefaultModel">Save</button>
          </div>
        </div>
        <div class="card">
          <details id="api-keys-details">
            <summary class="api-keys-summary">API Keys</summary>
            <p class="card-meta" style="margin:0.75rem 0">
              Keys are stored in
              <code>~/.config/labrats/settings.yaml</code>.
              Environment variables are used as fallback.</p>
            <div id="settings-fields"></div>
            <div class="btn-row">
              <button class="btn btn-primary"
                      data-action="saveApiKeys">Save</button>
            </div>
          </details>
        </div>
      </div>

    </div>

  </main>
</div>

<div class="toast" id="toast"></div>

<script src="/static/app.js"></script>
</body>
</html>
